    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Mini App ochilishi bilanoq darhol Fullscreenga o'tish va statik header bo'lib qolishining oldini olish -->
    <script>
      (function () {
        if ("scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }
        window.scrollTo(0, 0);

        function activateTelegramFullscreen() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;

            tg.ready();
            tg.expand();

            if (typeof tg.requestFullscreen === "function") {
              try {
                tg.requestFullscreen();
              } catch (e) {}
            }

            // Telegram Native WebView postEvent fallback (darhol to'liq ekranga o'tkazish kafolati)
            try {
              if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
                window.TelegramWebviewProxy.postEvent("web_app_request_fullscreen", JSON.stringify({}));
              } else if (window.external && window.external.notify) {
                window.external.notify(JSON.stringify({ eventType: "web_app_request_fullscreen", eventData: {} }));
              } else if (window.parent && window.parent.postMessage) {
                window.parent.postMessage(JSON.stringify({ eventType: "web_app_request_fullscreen", eventData: {} }), "*");
              }
            } catch (e) {}

            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            if (tg.setHeaderColor) tg.setHeaderColor("#ffffff");
            if (tg.setBackgroundColor) tg.setBackgroundColor("#f8fafd");
            if (tg.setBottomBarColor) tg.setBottomBarColor("#ffffff");

            var applyInsets = function () {
              try {
                var safeTop = (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
                var safeBottom = (tg.safeAreaInset && tg.safeAreaInset.bottom) || 0;
                if (safeTop > 0) document.documentElement.style.setProperty("--tg-safe-top", safeTop + "px");
                if (safeBottom > 0) document.documentElement.style.setProperty("--tg-safe-bottom", safeBottom + "px");
              } catch (e) {}
            };
            applyInsets();

            if (typeof tg.onEvent === "function") {
              tg.onEvent("safeAreaChanged", applyInsets);
              tg.onEvent("contentSafeAreaChanged", applyInsets);
              tg.onEvent("fullscreenChanged", applyInsets);
              tg.onEvent("viewportChanged", applyInsets);
            }
          } catch (e) {}
        }

        // 1. Script yuklanishi bilanoq darhol (sahifa render bo'lmasidan oldin)
        activateTelegramFullscreen();

        // 2. DOM va Window tayyor bo'lganda
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", activateTelegramFullscreen);
        }
        window.addEventListener("load", activateTelegramFullscreen);

        // 3. Birinchi teginish / klik paytidagi qo'shimcha kafolat
        window.addEventListener("touchstart", activateTelegramFullscreen, { passive: true, once: true });
        window.addEventListener("pointerdown", activateTelegramFullscreen, { passive: true, once: true });
        window.addEventListener("click", activateTelegramFullscreen, { passive: true, once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
